[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "J.A.R.V.I.S. — Just A Really Versatile Intelligent System"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "RodriFumo" }]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.0",
    "aiosqlite>=0.19.0",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
ai = [
    "google-generativeai>=0.8.0",
]
voice = [
    "pvporcupine>=3.0",
    "openai-whisper",
    "edge-tts",
    "speechbrain",
]
network = [
    "scapy>=2.5",
]
media = [
    "pychromecast>=14.0",
    "spotipy>=2.23",
]
web = [
    "aiohttp>=3.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
all = [
    "jarvis[ai,voice,network,media,web,dev]",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
